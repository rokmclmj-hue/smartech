<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 600px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #0d1b3e 0%, #1a2f5a 50%, #0d1b3e 100%);
    font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif;
  }
  .card {
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .badge {
    background: #c00020;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }
  .title {
    color: #ffffff;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }
  .sub {
    color: rgba(255,255,255,0.65);
    font-size: 18px;
    font-weight: 400;
    line-height: 1.7;
    letter-spacing: 0.01em;
  }
  .divider {
    width: 40px; height: 2px;
    background: #c00020;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="badge">진공 건조 드라이펌프</div>
  <div class="title">용매·규모·청정도<br>3가지 선택 기준</div>
  <div class="divider"></div>
  <div class="sub">소형 오븐 → nXDS 스크롤 &nbsp;|&nbsp; 대형 챔버 → GXS·EXS 스크류</div>
</div>
</body>
</html>
