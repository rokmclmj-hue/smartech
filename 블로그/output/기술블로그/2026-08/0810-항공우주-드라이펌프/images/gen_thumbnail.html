<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Pretendard'; src: local('Pretendard'); }
  body { margin:0; width:1080px; height:1080px; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#1a1a2e,#16213e); font-family: 'Pretendard','Malgun Gothic',sans-serif; }
  .wrap { text-align:center; padding:60px; display:flex; flex-direction:column; gap:20px; align-items:center; }
  .badge { display:inline-block; padding:8px 22px; border-radius:999px; background:rgba(255,255,255,0.1);
    color:#a0aec0; font-size:22px; letter-spacing:1px; }
  h1 { color:#ffffff; font-size:56px; line-height:1.35; margin:0; max-width:880px; font-weight:800; }
  .sub { color:#a0aec0; font-size:26px; margin:0; max-width:760px; line-height:1.5; }
  .icon { width:120px; height:120px; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">기술문의 · 항공우주</span>
    <svg class="icon" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#4a90d9" stroke-width="3" opacity="0.5"/>
      <circle cx="50" cy="50" r="30" stroke="#7fb8ec" stroke-width="2.5" opacity="0.7"/>
      <path d="M50 8 L54 20 L46 20 Z" fill="#c00020"/>
      <circle cx="50" cy="50" r="6" fill="#ffffff"/>
    </svg>
    <h1>항공우주 환경시험 챔버<br>드라이펌프 선택 기준 5가지</h1>
    <p class="sub">TVAC 챔버 배기부터 오일프리 요건까지</p>
  </div>
</body>
</html>
