<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; width:1200px; padding:60px; box-sizing:border-box; background:#0f1420; font-family:'Malgun Gothic',sans-serif; }
  h2 { color:#ffffff; font-size:32px; margin:0 0 36px 0; text-align:center; }
  .list { display:flex; flex-direction:column; gap:18px; }
  .item { display:flex; align-items:flex-start; gap:20px; background:#1a2233; border-radius:16px; padding:22px 28px; border:1px solid #2c3a54; }
  .num { width:40px; height:40px; min-width:40px; border-radius:50%; background:#c00020; color:#fff; font-size:20px;
    font-weight:800; display:flex; align-items:center; justify-content:center; }
  .txt h4 { color:#ffffff; font-size:21px; margin:0 0 4px 0; }
  .txt p { color:#a7b1c2; font-size:17px; margin:0; line-height:1.5; }
</style>
</head>
<body>
  <h2>항공우주 챔버 드라이펌프 선정 체크리스트</h2>
  <div class="list">
    <div class="item"><div class="num">1</div><div class="txt"><h4>챔버 크기</h4><p>대형(지름 3m 이상)은 GXS·EXS, 소형(벤치탑)은 nXDS·nXRi</p></div></div>
    <div class="item"><div class="num">2</div><div class="txt"><h4>목표 진공도</h4><p>저~중진공은 드라이 단독, UHV까지는 터보·크라이오·이온펌프 조합</p></div></div>
    <div class="item"><div class="num">3</div><div class="txt"><h4>부스터 필요 여부</h4><p>대용량 배기 시 EH 부스터를 현장 확인 조합표 기준으로 연결</p></div></div>
    <div class="item"><div class="num">4</div><div class="txt"><h4>오염 민감도</h4><p>광학·전자 부품이 있으면 오일프리가 사실상 필수</p></div></div>
    <div class="item"><div class="num">5</div><div class="txt"><h4>소음·설치 환경</h4><p>실험동 인접 시설은 GXS·nXDS 같은 저소음 모델 우선 검토</p></div></div>
  </div>
</body>
</html>
