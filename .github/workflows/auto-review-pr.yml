name: Auto Review PR

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch reviewed branch
        run: git fetch origin reviewed

      - name: Count new commits
        id: count
        run: |
          N=$(git rev-list --count origin/reviewed..HEAD)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "New commits: $N"

      - name: Create PR
        if: ${{ steps.count.outputs.n != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N="${{ steps.count.outputs.n }}"
          TODAY=$(date '+%Y-%m-%d')
          LOG=$(git log origin/reviewed..HEAD --oneline | awk '{print "- " $0}')

          OPEN=$(gh pr list --base reviewed --head master --state open --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            echo "PR #$OPEN already open"
            exit 0
          fi

          gh pr create \
            --base reviewed \
            --head master \
            --title "Code Review: ${N} commits (${TODAY})" \
            --body "$(printf '## New commits (%s)\n\n%s\n\n---\nRun `/code-review ultra <PR number>` to review.' "$N" "$LOG")"
