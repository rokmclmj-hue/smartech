<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- nXRi 컴팩트 드라이 펌프 - 작고 밀집된 구조 -->
  <!-- 컴팩트 하우징 (정사각형에 가까운) -->
  <rect x="45" y="45" width="100" height="100" rx="10"/>
  <!-- 내부 멀티 스테이지 압축 챔버 -->
  <line x1="55" y1="70" x2="135" y2="70"/>
  <line x1="55" y1="90" x2="135" y2="90"/>
  <line x1="55" y1="110" x2="135" y2="110"/>
  <line x1="55" y1="130" x2="135" y2="130"/>
  <!-- 중앙 축 -->
  <circle cx="95" cy="95" r="10"/>
  <!-- 상단 흡입 포트 -->
  <rect x="80" y="32" width="30" height="13" rx="3"/>
  <!-- 좌측 배출 포트 -->
  <line x1="45" y1="125" x2="30" y2="125"/>
  <line x1="30" y1="120" x2="30" y2="130"/>
  <line x1="24" y1="120" x2="24" y2="130"/>
  <!-- 냉각 핀 (하단) -->
  <line x1="65" y1="145" x2="65" y2="160"/>
  <line x1="80" y1="145" x2="80" y2="160"/>
  <line x1="95" y1="145" x2="95" y2="160"/>
  <line x1="110" y1="145" x2="110" y2="160"/>
  <line x1="125" y1="145" x2="125" y2="160"/>
</svg>
