<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- nXRi Compact Multi-Roots Dry Pump — SQUARE proportions (distinctly compact) -->
  <!-- Square compact body (almost cubic — very different from iXH/iXL towers) -->
  <rect x="34" y="34" width="122" height="122" rx="10" stroke-width="9"/>
  <!-- Multi-stage Roots lobes — 3 pairs of oval lobes stacked (side view) -->
  <!-- Stage 1 (top) — figure-8 profile -->
  <ellipse cx="90"  cy="62"  rx="28" ry="14" stroke-width="6"/>
  <ellipse cx="90"  cy="82"  rx="28" ry="14" stroke-width="6"/>
  <!-- Stage 2 (middle) -->
  <ellipse cx="90"  cy="104" rx="24" ry="12" stroke-width="5"/>
  <ellipse cx="90"  cy="120" rx="24" ry="12" stroke-width="5"/>
  <!-- Stage 3 (bottom) — smaller (high-pressure end) -->
  <ellipse cx="90"  cy="138" rx="18" ry="9"  stroke-width="4"/>
  <ellipse cx="90"  cy="151" rx="18" ry="9"  stroke-width="4"/>
  <!-- Shaft centers -->
  <circle cx="90" cy="72"  r="5" stroke-width="4"/>
  <circle cx="90" cy="112" r="4" stroke-width="4"/>
  <circle cx="90" cy="144" r="3" stroke-width="4"/>
  <!-- Top inlet port (square compact style) -->
  <rect x="78" y="20" width="34" height="14" rx="3" stroke-width="7"/>
  <!-- Left exhaust port -->
  <line x1="34"  y1="126" x2="16"  y2="126" stroke-width="7"/>
  <rect x="6"    y="119" width="10" height="14" rx="2" stroke-width="5"/>
  <!-- Right side — controller/electronics panel -->
  <rect x="156" y="50" width="10" height="90" rx="3" stroke-width="6"/>
  <line x1="156" y1="68"  x2="166" y2="68"  stroke-width="3"/>
  <line x1="156" y1="84"  x2="166" y2="84"  stroke-width="3"/>
  <line x1="156" y1="100" x2="166" y2="100" stroke-width="3"/>
  <line x1="156" y1="116" x2="166" y2="116" stroke-width="3"/>
</svg>
