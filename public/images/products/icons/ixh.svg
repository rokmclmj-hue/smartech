<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- iXH Semiconductor Dry Pump — MEDIUM vertical tower, cooling water T-connectors both sides -->
  <!-- Main tower body -->
  <rect x="58" y="28" width="76" height="130" rx="8" stroke-width="9"/>
  <!-- 3 compression stage dividers -->
  <line x1="64" y1="65"  x2="128" y2="65"  stroke-width="5"/>
  <line x1="64" y1="100" x2="128" y2="100" stroke-width="5"/>
  <line x1="64" y1="135" x2="128" y2="135" stroke-width="5"/>
  <!-- Center rotor shaft -->
  <line x1="96" y1="28" x2="96" y2="158" stroke-width="4" stroke-dasharray="6,4"/>
  <!-- Cooling water — LEFT side T-connectors (iXH distinctive) -->
  <line x1="58" y1="50"  x2="36" y2="50"  stroke-width="7"/>
  <line x1="30" y1="44"  x2="30" y2="56"  stroke-width="6"/>
  <circle cx="26" cy="50" r="7" stroke-width="5"/>
  <line x1="58" y1="118" x2="36" y2="118" stroke-width="7"/>
  <line x1="30" y1="112" x2="30" y2="124" stroke-width="6"/>
  <circle cx="26" cy="118" r="7" stroke-width="5"/>
  <!-- Cooling water — RIGHT side T-connectors -->
  <line x1="134" y1="50"  x2="156" y2="50"  stroke-width="7"/>
  <line x1="162" y1="44"  x2="162" y2="56"  stroke-width="6"/>
  <circle cx="166" cy="50" r="7" stroke-width="5"/>
  <line x1="134" y1="118" x2="156" y2="118" stroke-width="7"/>
  <line x1="162" y1="112" x2="162" y2="124" stroke-width="6"/>
  <circle cx="166" cy="118" r="7" stroke-width="5"/>
  <!-- Top inlet flange -->
  <rect x="76" y="14" width="40" height="14" rx="4" stroke-width="7"/>
  <!-- Bottom exhaust flange -->
  <rect x="76" y="158" width="40" height="14" rx="4" stroke-width="7"/>
  <!-- Mounting base -->
  <line x1="42"  y1="178" x2="150" y2="178" stroke-width="6"/>
  <line x1="62"  y1="172" x2="62"  y2="178" stroke-width="5"/>
  <line x1="130" y1="172" x2="130" y2="178" stroke-width="5"/>
</svg>
