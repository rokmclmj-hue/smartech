<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- 반도체 드라이 펌프 iXH - 수직 타워형 -->
  <!-- 메인 하우징 (수직형) -->
  <rect x="55" y="30" width="80" height="120" rx="10"/>
  <!-- 내부 멀티 스테이지 (다단 압축) -->
  <line x1="65" y1="60" x2="125" y2="60"/>
  <line x1="65" y1="80" x2="125" y2="80"/>
  <line x1="65" y1="100" x2="125" y2="100"/>
  <line x1="65" y1="120" x2="125" y2="120"/>
  <!-- 로터 축 -->
  <line x1="95" y1="30" x2="95" y2="150"/>
  <!-- 상단 흡입구 플랜지 -->
  <rect x="75" y="17" width="40" height="13" rx="3"/>
  <!-- 하단 배출구 플랜지 -->
  <rect x="75" y="150" width="40" height="13" rx="3"/>
  <!-- 냉각수 입출구 (우측) -->
  <line x1="135" y1="65" x2="150" y2="65"/>
  <line x1="135" y1="115" x2="150" y2="115"/>
  <circle cx="155" cy="65" r="6"/>
  <circle cx="155" cy="115" r="6"/>
  <!-- 받침대 -->
  <line x1="45" y1="163" x2="145" y2="163"/>
  <line x1="65" y1="163" x2="65" y2="175"/>
  <line x1="125" y1="163" x2="125" y2="175"/>
</svg>
