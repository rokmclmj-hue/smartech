<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- iXL Large Semiconductor Dry Pump — VERY TALL narrow tower, 5 stages -->
  <!-- Very tall narrow body (clearly different proportion from iXH) -->
  <rect x="66" y="18" width="62" height="158" rx="8" stroke-width="9"/>
  <!-- 5 compression stage dividers (more stages = larger pump) -->
  <line x1="72" y1="48"  x2="122" y2="48"  stroke-width="5"/>
  <line x1="72" y1="78"  x2="122" y2="78"  stroke-width="5"/>
  <line x1="72" y1="108" x2="122" y2="108" stroke-width="5"/>
  <line x1="72" y1="138" x2="122" y2="138" stroke-width="5"/>
  <!-- Center rotor shaft -->
  <line x1="97" y1="18" x2="97" y2="176" stroke-width="4" stroke-dasharray="5,4"/>
  <!-- Cooling water — LEFT only (different from iXH which has both sides) -->
  <line x1="66" y1="56"  x2="42" y2="56"  stroke-width="7"/>
  <rect x="34" y="49" width="8" height="14" rx="2" stroke-width="5"/>
  <line x1="66" y1="90"  x2="42" y2="90"  stroke-width="7"/>
  <rect x="34" y="83" width="8" height="14" rx="2" stroke-width="5"/>
  <line x1="66" y1="124" x2="42" y2="124" stroke-width="7"/>
  <rect x="34" y="117" width="8" height="14" rx="2" stroke-width="5"/>
  <!-- RIGHT side — 2 outputs (large pump has more) -->
  <line x1="128" y1="70"  x2="152" y2="70"  stroke-width="7"/>
  <rect x="152" y="63" width="8" height="14" rx="2" stroke-width="5"/>
  <line x1="128" y1="148" x2="152" y2="148" stroke-width="7"/>
  <rect x="152" y="141" width="8" height="14" rx="2" stroke-width="5"/>
  <!-- TOP inlet flange (large, prominent) -->
  <rect x="74" y="4"  width="46" height="14" rx="4" stroke-width="8"/>
  <!-- BOTTOM exhaust flange (large) -->
  <rect x="74" y="176" width="46" height="14" rx="4" stroke-width="8"/>
  <!-- Heavy base frame -->
  <line x1="38"  y1="196" x2="156" y2="196" stroke-width="7"/>
  <line x1="58"  y1="190" x2="58"  y2="196" stroke-width="6"/>
  <line x1="136" y1="190" x2="136" y2="196" stroke-width="6"/>
</svg>
