<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- iXL 대형 반도체 드라이 펌프 -->
  <!-- 대형 수직 하우징 -->
  <rect x="40" y="20" width="100" height="140" rx="10"/>
  <!-- 멀티 스테이지 격판 -->
  <line x1="50" y1="50" x2="130" y2="50"/>
  <line x1="50" y1="75" x2="130" y2="75"/>
  <line x1="50" y1="100" x2="130" y2="100"/>
  <line x1="50" y1="125" x2="130" y2="125"/>
  <!-- 중앙 로터 축 -->
  <line x1="90" y1="20" x2="90" y2="160"/>
  <!-- 상단 흡입 플랜지 (대형) -->
  <rect x="68" y="7" width="44" height="13" rx="3"/>
  <!-- 하단 배출 플랜지 (대형) -->
  <rect x="68" y="160" width="44" height="13" rx="3"/>
  <!-- 냉각수 연결 (좌측 입구, 우측 출구) -->
  <line x1="40" y1="58" x2="25" y2="58"/>
  <line x1="25" y1="53" x2="25" y2="63"/>
  <line x1="140" y1="120" x2="155" y2="120"/>
  <line x1="155" y1="115" x2="155" y2="125"/>
  <!-- 받침 프레임 (대형) -->
  <line x1="25" y1="178" x2="155" y2="178"/>
  <line x1="50" y1="173" x2="50" y2="178"/>
  <line x1="130" y1="173" x2="130" y2="178"/>
</svg>
