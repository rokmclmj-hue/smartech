<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- nXDS Dry Scroll Pump (small) — top view, tight Archimedean spiral -->
  <!-- Circular housing -->
  <circle cx="100" cy="100" r="82" stroke-width="9"/>
  <circle cx="100" cy="100" r="72" stroke-width="4"/>
  <!-- Archimedean spiral — 2.5 turns, tight, filling the space -->
  <path d="M100,100 C100,88 110,82 120,82 C138,82 150,94 150,112 C150,132 136,148 116,150 C92,153 72,138 68,114 C64,88 80,66 106,62 C136,57 162,74 166,104 C170,136 148,164 116,168" stroke-width="6"/>
  <!-- Center hub -->
  <circle cx="100" cy="100" r="10" stroke-width="6"/>
  <!-- Orbiting scroll (inner partial arc to show dual scroll) -->
  <path d="M100,100 C100,115 88,122 78,118 C64,112 60,96 66,84" stroke-width="4"/>
  <!-- Inlet port — top -->
  <rect x="84" y="14" width="32" height="14" rx="3" stroke-width="7"/>
  <!-- Outlet port — bottom -->
  <rect x="84" y="172" width="32" height="14" rx="3" stroke-width="7"/>
</svg>
