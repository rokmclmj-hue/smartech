<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- nES — modern horizontal vane pump with integrated electronics -->
  <!-- Pump body (sleek horizontal) -->
  <rect x="22" y="68" width="108" height="64" rx="6" stroke-width="9"/>
  <!-- Left inlet flange -->
  <circle cx="22" cy="100" r="22" stroke-width="9"/>
  <circle cx="22" cy="100" r="11" stroke-width="4"/>
  <!-- Internal rotor — larger, more detailed -->
  <circle cx="80" cy="100" r="26" stroke-width="6"/>
  <line x1="80" y1="74"  x2="80"  y2="126" stroke-width="5"/>
  <line x1="54" y1="100" x2="106" y2="100" stroke-width="5"/>
  <line x1="61" y1="81"  x2="99"  y2="119" stroke-width="4"/>
  <line x1="99" y1="81"  x2="61"  y2="119" stroke-width="4"/>
  <!-- Integrated electronics module (right end — nES distinctive feature) -->
  <rect x="130" y="58" width="46" height="84" rx="5" stroke-width="8"/>
  <!-- Display window -->
  <rect x="138" y="66" width="30" height="16" rx="2" stroke-width="5"/>
  <!-- Display lines (digital readout) -->
  <line x1="141" y1="72" x2="164" y2="72" stroke-width="3"/>
  <line x1="141" y1="77" x2="164" y2="77" stroke-width="3"/>
  <!-- Status LED row -->
  <circle cx="141" cy="93" r="3" stroke-width="3"/>
  <circle cx="151" cy="93" r="3" stroke-width="3"/>
  <circle cx="161" cy="93" r="3" stroke-width="3"/>
  <!-- Control buttons -->
  <rect x="138" y="103" width="12" height="10" rx="2" stroke-width="3"/>
  <rect x="154" y="103" width="12" height="10" rx="2" stroke-width="3"/>
  <!-- Connector port on electronics -->
  <rect x="141" y="118" width="20" height="12" rx="2" stroke-width="4"/>
  <!-- Ventilation slots -->
  <line x1="138" y1="135" x2="168" y2="135" stroke-width="3"/>
  <line x1="138" y1="130" x2="168" y2="130" stroke-width="3"/>
  <!-- Base -->
  <rect x="26" y="145" width="104" height="8" rx="3" stroke-width="6"/>
  <line x1="44"  y1="153" x2="44"  y2="168" stroke-width="5"/>
  <line x1="116" y1="153" x2="116" y2="168" stroke-width="5"/>
  <line x1="28"  y1="168" x2="130" y2="168" stroke-width="5"/>
</svg>
