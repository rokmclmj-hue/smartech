<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- 산업용 드라이 스크류 펌프 GXS - 대형 스크류 구조 -->
  <!-- 메인 하우징 (가로로 긴 대형) -->
  <rect x="20" y="55" width="145" height="80" rx="8"/>
  <!-- 스크류 나선 표현 (이중 스크류) -->
  <!-- 상단 스크류 -->
  <path d="M30 75 Q 50 65 70 75 Q 90 85 110 75 Q 130 65 150 75"/>
  <path d="M30 85 Q 50 95 70 85 Q 90 75 110 85 Q 130 95 150 85"/>
  <!-- 하단 스크류 -->
  <path d="M30 110 Q 50 100 70 110 Q 90 120 110 110 Q 130 100 150 110"/>
  <path d="M30 120 Q 50 130 70 120 Q 90 110 110 120 Q 130 130 150 120"/>
  <!-- 흡입구 (좌측 상단) -->
  <line x1="20" y1="70" x2="10" y2="70"/>
  <line x1="10" y1="65" x2="10" y2="75"/>
  <line x1="5" y1="65" x2="5" y2="75"/>
  <!-- 배출구 (우측 하단) -->
  <line x1="165" y1="120" x2="175" y2="120"/>
  <line x1="175" y1="115" x2="175" y2="125"/>
  <line x1="180" y1="115" x2="180" y2="125"/>
  <!-- 냉각 핀 -->
  <line x1="40" y1="135" x2="40" y2="148"/>
  <line x1="65" y1="135" x2="65" y2="148"/>
  <line x1="90" y1="135" x2="90" y2="148"/>
  <line x1="115" y1="135" x2="115" y2="148"/>
  <line x1="140" y1="135" x2="140" y2="148"/>
  <!-- 모터부 -->
  <rect x="162" y="60" width="18" height="65" rx="5"/>
</svg>
