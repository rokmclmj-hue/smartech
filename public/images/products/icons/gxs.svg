<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- GXS Industrial Dry Screw Pump — side view, twin helical screws prominent -->
  <!-- Main housing body (wide horizontal) -->
  <rect x="14" y="52" width="144" height="88" rx="8" stroke-width="9"/>
  <!-- Upper screw shaft — helical thread profile (distinctive sine waves) -->
  <path d="M24,76 C34,68 44,84 54,76 C64,68 74,84 84,76 C94,68 104,84 114,76 C124,68 134,84 144,76" stroke-width="6"/>
  <path d="M24,84 C34,92 44,76 54,84 C64,92 74,76 84,84 C94,92 104,76 114,84 C124,92 134,76 144,84" stroke-width="6"/>
  <!-- Divider between two screw shafts -->
  <line x1="18" y1="100" x2="154" y2="100" stroke-width="4" stroke-dasharray="8,4"/>
  <!-- Lower screw shaft — same helix, opposite phase -->
  <path d="M24,116 C34,108 44,124 54,116 C64,108 74,124 84,116 C94,108 104,124 114,116 C124,108 134,124 144,116" stroke-width="6"/>
  <path d="M24,124 C34,132 44,116 54,124 C64,132 74,116 84,124 C94,132 104,116 114,124 C124,132 134,116 144,124" stroke-width="6"/>
  <!-- Inlet — top left flange -->
  <rect x="22" y="36" width="32" height="16" rx="3" stroke-width="7"/>
  <!-- Outlet — bottom right flange -->
  <rect x="108" y="140" width="32" height="16" rx="3" stroke-width="7"/>
  <!-- Motor block (large, right side) -->
  <rect x="158" y="46" width="28" height="100" rx="6" stroke-width="9"/>
  <line x1="166" y1="58"  x2="178" y2="58"  stroke-width="4"/>
  <line x1="166" y1="70"  x2="178" y2="70"  stroke-width="4"/>
  <line x1="166" y1="82"  x2="178" y2="82"  stroke-width="4"/>
  <line x1="166" y1="94"  x2="178" y2="94"  stroke-width="4"/>
  <line x1="166" y1="106" x2="178" y2="106" stroke-width="4"/>
  <line x1="166" y1="118" x2="178" y2="118" stroke-width="4"/>
  <line x1="166" y1="130" x2="178" y2="130" stroke-width="4"/>
  <!-- Cooling fins bottom -->
  <line x1="36"  y1="140" x2="36"  y2="155" stroke-width="5"/>
  <line x1="56"  y1="140" x2="56"  y2="155" stroke-width="5"/>
  <line x1="76"  y1="140" x2="76"  y2="155" stroke-width="5"/>
  <line x1="96"  y1="140" x2="96"  y2="155" stroke-width="5"/>
  <line x1="116" y1="140" x2="116" y2="155" stroke-width="5"/>
  <line x1="136" y1="140" x2="136" y2="155" stroke-width="5"/>
</svg>
