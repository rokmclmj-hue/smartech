<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- EXS Corrosion-Resistant Dry Screw — double-wall housing (coating), special end flanges -->
  <!-- Outer housing wall -->
  <rect x="18" y="55" width="132" height="82" rx="8" stroke-width="9"/>
  <!-- Inner liner wall (corrosion coating — distinctive double wall) -->
  <rect x="26" y="63" width="116" height="66" rx="5" stroke-width="5"/>
  <!-- Upper screw helix -->
  <path d="M34,78 C44,70 54,86 64,78 C74,70 84,86 94,78 C104,70 114,86 124,78 C134,70 138,82 134,88" stroke-width="5"/>
  <path d="M34,86 C44,94 54,78 64,86 C74,94 84,78 94,86 C104,94 114,78 124,86 C134,94 138,82 134,88" stroke-width="5"/>
  <!-- Center divider -->
  <line x1="22" y1="96" x2="146" y2="96" stroke-width="3" stroke-dasharray="7,4"/>
  <!-- Lower screw helix -->
  <path d="M34,104 C44,96 54,112 64,104 C74,96 84,112 94,104 C104,96 114,112 124,104 C134,96 138,108 134,114" stroke-width="5"/>
  <path d="M34,112 C44,120 54,104 64,112 C74,120 84,104 94,112 C104,120 114,104 124,112 C134,120 138,108 134,114" stroke-width="5"/>
  <!-- Special corrosion-resistant inlet flange (oval — PTFE lined) -->
  <ellipse cx="18" cy="96" rx="14" ry="22" stroke-width="8"/>
  <ellipse cx="18" cy="96" rx="7"  ry="12" stroke-width="4"/>
  <!-- Outlet — special raised boss (different from GXS flat) -->
  <ellipse cx="150" cy="96" rx="14" ry="22" stroke-width="8"/>
  <ellipse cx="150" cy="96" rx="7"  ry="12" stroke-width="4"/>
  <!-- Motor block (shorter than GXS) -->
  <rect x="164" y="60" width="24" height="72" rx="5" stroke-width="8"/>
  <line x1="172" y1="72"  x2="180" y2="72"  stroke-width="3"/>
  <line x1="172" y1="84"  x2="180" y2="84"  stroke-width="3"/>
  <line x1="172" y1="96"  x2="180" y2="96"  stroke-width="3"/>
  <line x1="172" y1="108" x2="180" y2="108" stroke-width="3"/>
  <line x1="172" y1="120" x2="180" y2="120" stroke-width="3"/>
  <!-- Drain port bottom (corrosion-resistant feature) -->
  <line x1="84"  y1="137" x2="84"  y2="152" stroke-width="6"/>
  <circle cx="84" cy="157" r="8" stroke-width="5"/>
</svg>
