<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- T-Station Turbo Pumping Station — rack cabinet, 3 sections -->
  <!-- Cabinet outer frame -->
  <rect x="16" y="12" width="168" height="176" rx="8" stroke-width="9"/>
  <!-- Section divider lines -->
  <line x1="22" y1="80"  x2="178" y2="80"  stroke-width="5"/>
  <line x1="22" y1="132" x2="178" y2="132" stroke-width="5"/>
  <!-- TOP SECTION: Turbomolecular pump (top view circle) -->
  <circle cx="100" cy="46" r="26" stroke-width="7"/>
  <circle cx="100" cy="46" r="14" stroke-width="4"/>
  <!-- Turbo blades (top view — 6 curved blades) -->
  <path d="M100,32 Q112,36 114,46" stroke-width="4"/>
  <path d="M114,46 Q118,58 108,60" stroke-width="4"/>
  <path d="M108,60 Q96,64 88,56" stroke-width="4"/>
  <path d="M88,56 Q82,44 86,36" stroke-width="4"/>
  <path d="M86,36 Q94,28 100,32" stroke-width="4"/>
  <!-- Inlet port top -->
  <line x1="100" y1="12" x2="100" y2="20" stroke-width="6"/>
  <!-- MIDDLE SECTION: Backing pump (side view small) -->
  <rect x="30" y="88" width="90" height="36" rx="5" stroke-width="7"/>
  <circle cx="42"  cy="106" r="12" stroke-width="5"/>
  <line x1="42"  y1="94"  x2="42"  y2="118" stroke-width="3"/>
  <line x1="30"  y1="106" x2="54"  y2="106" stroke-width="3"/>
  <line x1="120" y1="97"  x2="136" y2="97"  stroke-width="6"/>
  <line x1="120" y1="115" x2="136" y2="115" stroke-width="6"/>
  <rect x="136" y="92" width="14" height="28" rx="3" stroke-width="5"/>
  <!-- BOTTOM SECTION: Controller display -->
  <rect x="28" y="140" width="144" height="56" rx="5" stroke-width="7"/>
  <!-- Digital display window -->
  <rect x="36" y="148" width="80" height="22" rx="3" stroke-width="5"/>
  <!-- Display digit lines -->
  <line x1="42"  y1="155" x2="62"  y2="155" stroke-width="3"/>
  <line x1="42"  y1="162" x2="62"  y2="162" stroke-width="3"/>
  <line x1="68"  y1="155" x2="88"  y2="155" stroke-width="3"/>
  <line x1="68"  y1="162" x2="88"  y2="162" stroke-width="3"/>
  <!-- Control knob -->
  <circle cx="152" cy="155" r="12" stroke-width="6"/>
  <line x1="152" y1="143" x2="152" y2="148" stroke-width="4"/>
  <!-- Status LEDs -->
  <circle cx="136" cy="175" r="4" stroke-width="4"/>
  <circle cx="150" cy="175" r="4" stroke-width="4"/>
  <circle cx="164" cy="175" r="4" stroke-width="4"/>
</svg>
