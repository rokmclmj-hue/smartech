<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ultra 19 Vacuum Pump Oil — oil container / drum -->
  <!-- Main cylindrical can body -->
  <rect x="44" y="50" width="112" height="128" rx="12" stroke-width="9"/>
  <!-- Top lid (slightly wider, overlapping edge) -->
  <rect x="38" y="38" width="124" height="18" rx="6" stroke-width="8"/>
  <!-- Pour spout on top lid -->
  <rect x="82" y="22" width="36" height="18" rx="5" stroke-width="7"/>
  <line x1="82"  y1="38" x2="82"  y2="38" stroke-width="7"/>
  <!-- Spout cap -->
  <ellipse cx="100" cy="22" rx="18" ry="6" stroke-width="6"/>
  <!-- Label area (rectangle band around middle of can) -->
  <rect x="50"  y="76"  width="100" height="68" rx="4" stroke-width="6"/>
  <!-- Label content lines (brand/text simulation) -->
  <line x1="62"  y1="92"  x2="138" y2="92"  stroke-width="5"/>
  <line x1="62"  y1="104" x2="138" y2="104" stroke-width="5"/>
  <line x1="62"  y1="116" x2="138" y2="116" stroke-width="5"/>
  <line x1="74"  y1="128" x2="126" y2="128" stroke-width="4"/>
  <!-- Oil drop symbol (below label — oil product icon) -->
  <path d="M100,154 Q86,154 86,164 Q86,176 100,178 Q114,176 114,164 Q114,154 100,154 Z" stroke-width="6"/>
  <line x1="100" y1="144" x2="100" y2="154" stroke-width="5"/>
  <!-- Bottom rim -->
  <rect x="40"  y="172" width="120" height="10" rx="4" stroke-width="6"/>
</svg>
