<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- ADC Active Digital Controller — square box, 3 large dials + display -->
  <!-- Main housing -->
  <rect x="14" y="14" width="172" height="172" rx="8" stroke-width="9"/>
  <!-- Inner panel -->
  <rect x="22" y="22" width="156" height="156" rx="5" stroke-width="4"/>
  <!-- Digital display strip (top) -->
  <rect x="30" y="30" width="140" height="30" rx="4" stroke-width="7"/>
  <line x1="40"  y1="40"  x2="76"  y2="40"  stroke-width="4"/>
  <line x1="40"  y1="50"  x2="76"  y2="50"  stroke-width="4"/>
  <line x1="86"  y1="40"  x2="122" y2="40"  stroke-width="4"/>
  <line x1="86"  y1="50"  x2="122" y2="50"  stroke-width="4"/>
  <line x1="132" y1="40"  x2="162" y2="40"  stroke-width="4"/>
  <line x1="132" y1="50"  x2="162" y2="50"  stroke-width="4"/>
  <!-- THREE large analog dials (ADC signature — multiple channels) -->
  <!-- Dial 1 (left) -->
  <circle cx="46"  cy="108" r="28" stroke-width="7"/>
  <circle cx="46"  cy="108" r="18" stroke-width="4"/>
  <line x1="46"   cy="108" x2="58"  y2="88"  stroke-width="6"/> <!-- needle -->
  <circle cx="46"  cy="108" r="5"  stroke-width="5"/>
  <line x1="46"   y1="80"  x2="46"  y2="86"  stroke-width="4"/>
  <line x1="66"   y1="88"  x2="62"  y2="93"  stroke-width="4"/>
  <line x1="74"   y1="108" x2="68"  y2="108" stroke-width="4"/>
  <line x1="26"   y1="88"  x2="30"  y2="93"  stroke-width="4"/>
  <line x1="18"   y1="108" x2="24"  y2="108" stroke-width="4"/>
  <!-- Dial 2 (center) -->
  <circle cx="100" cy="108" r="28" stroke-width="7"/>
  <circle cx="100" cy="108" r="18" stroke-width="4"/>
  <line x1="100"  y1="108" x2="114" y2="93"  stroke-width="6"/>
  <circle cx="100" cy="108" r="5"  stroke-width="5"/>
  <line x1="100"  y1="80"  x2="100" y2="86"  stroke-width="4"/>
  <line x1="120"  y1="88"  x2="116" y2="93"  stroke-width="4"/>
  <line x1="128"  y1="108" x2="122" y2="108" stroke-width="4"/>
  <line x1="80"   y1="88"  x2="84"  y2="93"  stroke-width="4"/>
  <line x1="72"   y1="108" x2="78"  y2="108" stroke-width="4"/>
  <!-- Dial 3 (right) -->
  <circle cx="154" cy="108" r="28" stroke-width="7"/>
  <circle cx="154" cy="108" r="18" stroke-width="4"/>
  <line x1="154"  y1="108" x2="164" y2="88"  stroke-width="6"/>
  <circle cx="154" cy="108" r="5"  stroke-width="5"/>
  <line x1="154"  y1="80"  x2="154" y2="86"  stroke-width="4"/>
  <line x1="174"  y1="88"  x2="170" y2="93"  stroke-width="4"/>
  <line x1="182"  y1="108" x2="176" y2="108" stroke-width="4"/>
  <line x1="134"  y1="88"  x2="138" y2="93"  stroke-width="4"/>
  <line x1="126"  y1="108" x2="132" y2="108" stroke-width="4"/>
  <!-- Bottom connector ports row -->
  <circle cx="46"  cy="156" r="8" stroke-width="6"/>
  <circle cx="72"  cy="156" r="8" stroke-width="6"/>
  <circle cx="100" cy="156" r="8" stroke-width="6"/>
  <circle cx="128" cy="156" r="8" stroke-width="6"/>
  <circle cx="154" cy="156" r="8" stroke-width="6"/>
</svg>
