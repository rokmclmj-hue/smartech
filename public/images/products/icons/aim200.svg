<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- AIM200 Ion Gauge — glass tube with internal electrode cage structure -->
  <!-- Glass tube housing (tall rounded tube) -->
  <rect x="60" y="18" width="80" height="148" rx="40" stroke-width="9"/>
  <!-- Inner tube wall -->
  <rect x="70" y="28" width="60" height="128" rx="30" stroke-width="4"/>
  <!-- Anode cage — oval grid structure (ion gauge signature) -->
  <ellipse cx="100" cy="92" rx="22" ry="38" stroke-width="6"/>
  <!-- Anode grid bars (horizontal) -->
  <line x1="78"  y1="72"  x2="122" y2="72"  stroke-width="3"/>
  <line x1="78"  y1="86"  x2="122" y2="86"  stroke-width="3"/>
  <line x1="78"  y1="100" x2="122" y2="100" stroke-width="3"/>
  <line x1="78"  y1="114" x2="122" y2="114" stroke-width="3"/>
  <!-- Center collector wire -->
  <line x1="100" y1="54"  x2="100" y2="130" stroke-width="4"/>
  <!-- Filament wires — LEFT (electron emitters) -->
  <path d="M78,74 Q72,82 78,90" stroke-width="5"/>
  <path d="M78,104 Q72,112 78,120" stroke-width="5"/>
  <!-- Filament wires — RIGHT -->
  <path d="M122,74 Q128,82 122,90" stroke-width="5"/>
  <path d="M122,104 Q128,112 122,120" stroke-width="5"/>
  <!-- Electrical leads — top (BNC/connector pins) -->
  <line x1="100" y1="18" x2="100" y2="6"  stroke-width="6"/>
  <line x1="86"  y1="6"  x2="114" y2="6"  stroke-width="5"/>
  <line x1="86"  y1="6"  x2="86"  y2="0"  stroke-width="4"/>
  <line x1="100" y1="6"  x2="100" y2="0"  stroke-width="4"/>
  <line x1="114" y1="6"  x2="114" y2="0"  stroke-width="4"/>
  <!-- Connection port — bottom -->
  <line x1="100" y1="166" x2="100" y2="184" stroke-width="8"/>
  <rect x="84" y="184" width="32" height="12" rx="4" stroke-width="6"/>
</svg>
