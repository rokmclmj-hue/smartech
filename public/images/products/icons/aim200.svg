<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- 고진공 이온 게이지 AIM200 - 이온 궤도 표현 -->
  <!-- 외부 튜브 하우징 -->
  <rect x="60" y="30" width="70" height="130" rx="35"/>
  <!-- 이온 수집 양극 (아노드 - 중심 와이어) -->
  <line x1="95" y1="50" x2="95" y2="140"/>
  <!-- 이온 궤도 타원 -->
  <ellipse cx="95" cy="95" rx="22" ry="32"/>
  <ellipse cx="95" cy="95" rx="14" ry="20"/>
  <!-- 전자 방출 필라멘트 (두 개) -->
  <path d="M 70 75 Q 78 80 70 85"/>
  <path d="M 70 105 Q 78 110 70 115"/>
  <path d="M 120 75 Q 112 80 120 85"/>
  <path d="M 120 105 Q 112 110 120 115"/>
  <!-- 전기 연결선 (상단/하단) -->
  <line x1="95" y1="30" x2="95" y2="15"/>
  <line x1="85" y1="15" x2="105" y2="15"/>
  <!-- 연결 포트 (하단) -->
  <line x1="95" y1="160" x2="95" y2="175"/>
  <line x1="85" y1="175" x2="105" y2="175"/>
  <!-- 이온 전류 방향 화살표 표시 -->
  <line x1="73" y1="90" x2="62" y2="90"/>
  <line x1="62" y1="85" x2="62" y2="95"/>
</svg>
