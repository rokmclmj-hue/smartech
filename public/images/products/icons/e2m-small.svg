<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- E2M Small — dual-stage rectangular housing, inlet left, motor right -->
  <!-- Stage 1 housing -->
  <rect x="22" y="65" width="68" height="70" rx="6" stroke-width="9"/>
  <!-- Stage 2 housing (slightly smaller) -->
  <rect x="90" y="72" width="52" height="56" rx="6" stroke-width="9"/>
  <!-- Stage coupling flange between 1 and 2 -->
  <line x1="90" y1="77" x2="90" y2="123" stroke-width="6"/>
  <!-- Left inlet — circular KF flange -->
  <circle cx="22" cy="100" r="20" stroke-width="9"/>
  <circle cx="22" cy="100" r="10" stroke-width="4"/>
  <!-- Stage-1 rotor (cross inside) -->
  <circle cx="56" cy="100" r="18" stroke-width="5"/>
  <line x1="56" y1="82"  x2="56"  y2="118" stroke-width="4"/>
  <line x1="38" y1="100" x2="74"  y2="100" stroke-width="4"/>
  <!-- Stage-2 rotor -->
  <circle cx="116" cy="100" r="14" stroke-width="5"/>
  <line x1="116" y1="86"  x2="116" y2="114" stroke-width="3"/>
  <line x1="102" y1="100" x2="130" y2="100" stroke-width="3"/>
  <!-- Motor block on right -->
  <rect x="142" y="76" width="28" height="48" rx="5" stroke-width="8"/>
  <line x1="152" y1="85"  x2="160" y2="85"  stroke-width="3"/>
  <line x1="152" y1="92"  x2="160" y2="92"  stroke-width="3"/>
  <line x1="152" y1="99"  x2="160" y2="99"  stroke-width="3"/>
  <!-- Oil sight glass on stage 1 -->
  <rect x="34" y="80" width="10" height="22" rx="2" stroke-width="4"/>
  <!-- Mounting base -->
  <rect x="27" y="148" width="128" height="8" rx="3" stroke-width="6"/>
  <line x1="48"  y1="156" x2="48"  y2="170" stroke-width="5"/>
  <line x1="138" y1="156" x2="138" y2="170" stroke-width="5"/>
  <line x1="30"  y1="170" x2="155" y2="170" stroke-width="5"/>
</svg>
