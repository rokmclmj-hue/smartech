  <circle cx="90" cy="100" r="18"/>
  <line x1="90" y1="82" x2="90" y2="118"/>
  <line x1="72" y1="100" x2="108" y2="100"/>
  <!-- 상단 오일 캡 -->
  <rect x="78" y="60" width="24" height="15" rx="3"/>
  <!-- 받침대 -->
  <rect x="45" y="125" width="90" height="12" rx="3"/>
  <line x1="60" y1="137" x2="60" y2="150"/>
  <line x1="120" y1="137" x2="120" y2="150"/>
  <line x1="45" y1="150" x2="135" y2="150"/>
</svg>
