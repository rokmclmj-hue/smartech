<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- 헬륨 리크 디텍터 ELD500 - 탐지기 -->
  <!-- 탐지기 본체 박스 -->
  <rect x="30" y="70" width="100" height="90" rx="8"/>
  <!-- 디스플레이 창 -->
  <rect x="42" y="82" width="55" height="30" rx="4"/>
  <!-- 신호 막대 (리크 레벨 표시) -->
  <line x1="50" y1="105" x2="50" y2="95"/>
  <line x1="60" y1="105" x2="60" y2="90"/>
  <line x1="70" y1="105" x2="70" y2="84"/>
  <line x1="80" y1="105" x2="80" y2="88"/>
  <line x1="90" y1="105" x2="90" y2="92"/>
  <!-- 버튼들 -->
  <circle cx="50" cy="125" r="6"/>
  <circle cx="70" cy="125" r="6"/>
  <circle cx="90" cy="125" r="6"/>
  <!-- 탐침 연결부 -->
  <line x1="130" y1="95" x2="150" y2="75"/>
  <!-- 탐침 (프로브) -->
  <line x1="150" y1="75" x2="175" y2="45"/>
  <circle cx="178" cy="42" r="6"/>
  <!-- 신호 방사 표시 -->
  <path d="M 170 30 Q 183 25 185 38" stroke-dasharray="3,3"/>
  <path d="M 175 20 Q 192 15 194 32" stroke-dasharray="3,3"/>
  <!-- 연결 케이블 라인 -->
  <path d="M 130 95 Q 140 100 130 110"/>
</svg>
