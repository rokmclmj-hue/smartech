<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- ELD500 Helium Leak Detector — console box + extending probe wand -->
  <!-- Main console body -->
  <rect x="14" y="72" width="116" height="112" rx="8" stroke-width="9"/>
  <!-- LED bar display (leak level indicator — vertical bars) -->
  <rect x="24" y="82" width="56" height="44" rx="4" stroke-width="6"/>
  <line x1="33"  y1="118" x2="33"  y2="98"  stroke-width="5"/>
  <line x1="43"  y1="118" x2="43"  y2="92"  stroke-width="5"/>
  <line x1="53"  y1="118" x2="53"  y2="86"  stroke-width="5"/>
  <line x1="63"  y1="118" x2="63"  y2="90"  stroke-width="5"/>
  <line x1="72"  y1="118" x2="72"  y2="96"  stroke-width="5"/>
  <!-- He symbol area -->
  <rect x="86"  y="82" width="36" height="18" rx="3" stroke-width="5"/>
  <!-- Control buttons row -->
  <circle cx="30"  cy="142" r="8" stroke-width="5"/>
  <circle cx="52"  cy="142" r="8" stroke-width="5"/>
  <circle cx="74"  cy="142" r="8" stroke-width="5"/>
  <circle cx="96"  cy="142" r="8" stroke-width="5"/>
  <!-- Pump section status light -->
  <rect x="24" y="158" width="96" height="18" rx="4" stroke-width="5"/>
  <line x1="34"  y1="165" x2="34"  y2="169" stroke-width="4"/>
  <line x1="50"  y1="165" x2="50"  y2="169" stroke-width="4"/>
  <line x1="66"  y1="165" x2="66"  y2="169" stroke-width="4"/>
  <line x1="82"  y1="165" x2="82"  y2="169" stroke-width="4"/>
  <line x1="98"  y1="165" x2="98"  y2="169" stroke-width="4"/>
  <!-- Probe wand connector on top-right of console -->
  <line x1="94"  y1="72"  x2="94"  y2="58"  stroke-width="7"/>
  <!-- Flexible hose to probe -->
  <path d="M94,58 Q110,44 130,36" stroke-width="6"/>
  <!-- Probe rigid section -->
  <line x1="130" y1="36" x2="174" y2="10" stroke-width="7"/>
  <!-- Probe tip (sniffing nozzle) -->
  <circle cx="178" cy="8"  r="8"  stroke-width="6"/>
  <circle cx="178" cy="8"  r="3"  stroke-width="4"/>
  <!-- He leak signal waves from probe tip -->
  <path d="M178,0 Q192,-4 190,8"  stroke-width="3" stroke-dasharray="3,3"/>
  <path d="M186,4 Q196,0  196,14" stroke-width="3" stroke-dasharray="3,3"/>
</svg>
