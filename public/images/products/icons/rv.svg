<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- RV Oil Rotary Vane Pump — horizontal pill body, large KF inlet flange -->
  <!-- Main body (pill/capsule) -->
  <rect x="38" y="70" width="118" height="60" rx="30" stroke-width="9"/>
  <!-- Left inlet — large KF flange (most distinctive RV feature) -->
  <circle cx="38" cy="100" r="26" stroke-width="9"/>
  <circle cx="38" cy="100" r="14" stroke-width="4"/>
  <!-- 4-vane rotor inside body -->
  <circle cx="108" cy="100" r="24" stroke-width="5"/>
  <line x1="108" y1="76" x2="108" y2="124" stroke-width="4"/>
  <line x1="84"  y1="100" x2="132" y2="100" stroke-width="4"/>
  <line x1="91"  y1="83"  x2="125" y2="117" stroke-width="3"/>
  <line x1="125" y1="83"  x2="91"  y2="117" stroke-width="3"/>
  <!-- Oil fill cap on top -->
  <circle cx="90" cy="58" r="10" stroke-width="6"/>
  <line x1="90" y1="68" x2="90" y2="70" stroke-width="6"/>
  <!-- Right exhaust port (smaller rectangular flange) -->
  <rect x="156" y="86" width="14" height="28" rx="3" stroke-width="6"/>
  <!-- Mounting base plate + legs -->
  <rect x="43" y="143" width="104" height="9" rx="3" stroke-width="6"/>
  <line x1="62"  y1="152" x2="62"  y2="168" stroke-width="5"/>
  <line x1="128" y1="152" x2="128" y2="168" stroke-width="5"/>
  <line x1="46"  y1="168" x2="144" y2="168" stroke-width="5"/>
</svg>
