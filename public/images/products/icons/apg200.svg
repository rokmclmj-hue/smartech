<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- 저진공 게이지 APG200 - 원형 압력계 다이얼 -->
  <!-- 외부 원형 케이스 -->
  <circle cx="100" cy="100" r="70"/>
  <!-- 내부 다이얼 면 -->
  <circle cx="100" cy="100" r="58"/>
  <!-- 눈금 (주요 눈금 8개) -->
  <line x1="100" y1="42" x2="100" y2="52"/>
  <line x1="141" y1="59" x2="134" y2="66"/>
  <line x1="158" y1="100" x2="148" y2="100"/>
  <line x1="141" y1="141" x2="134" y2="134"/>
  <line x1="100" y1="158" x2="100" y2="148"/>
  <line x1="59" y1="141" x2="66" y2="134"/>
  <line x1="42" y1="100" x2="52" y2="100"/>
  <line x1="59" y1="59" x2="66" y2="66"/>
  <!-- 중심 피봇 -->
  <circle cx="100" cy="100" r="5"/>
  <!-- 압력 바늘 (약 2/3 위치 가리킴) -->
  <line x1="100" y1="100" x2="130" y2="62"/>
  <!-- 하단 연결 포트 -->
  <line x1="100" y1="170" x2="100" y2="185"/>
  <circle cx="100" cy="188" r="5"/>
  <!-- 단위 표시 영역 -->
  <rect x="75" y="110" width="50" height="16" rx="3"/>
</svg>
