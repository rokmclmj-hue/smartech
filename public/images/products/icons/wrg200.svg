<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- WRG200 Combined Gauge — Pirani (top) + Inverted Magnetron (bottom) + shared port -->
  <!-- Compact housing body -->
  <rect x="28" y="14" width="144" height="158" rx="10" stroke-width="9"/>
  <!-- Divider between two sensing elements -->
  <line x1="34" y1="96" x2="166" y2="96" stroke-width="5"/>
  <!-- TOP SECTION: Pirani gauge element -->
  <!-- Pirani dial face -->
  <circle cx="100" cy="55" r="34" stroke-width="7"/>
  <circle cx="100" cy="55" r="22" stroke-width="4"/>
  <!-- Pirani needle -->
  <line x1="100" y1="55" x2="118" y2="38" stroke-width="6"/>
  <circle cx="100" cy="55" r="6"  stroke-width="5"/>
  <!-- Pirani scale ticks -->
  <line x1="100" y1="21" x2="100" y2="28" stroke-width="4"/>
  <line x1="124" y1="28" x2="120" y2="34" stroke-width="4"/>
  <line x1="134" y1="55" x2="127" y2="55" stroke-width="4"/>
  <line x1="76"  y1="21" x2="80"  y2="28" stroke-width="4"/>
  <line x1="66"  y1="55" x2="73"  y2="55" stroke-width="4"/>
  <!-- BOTTOM SECTION: Inverted Magnetron element -->
  <!-- Magnetron cylindrical housing -->
  <rect x="50" y="108" width="100" height="50" rx="8" stroke-width="7"/>
  <!-- Magnetron anode cylinder (inner) -->
  <rect x="62" y="116" width="76" height="34" rx="5" stroke-width="4"/>
  <!-- Magnetron ring magnets (distinctive symbol) -->
  <ellipse cx="100" cy="118" rx="28" ry="5" stroke-width="5"/>
  <ellipse cx="100" cy="148" rx="28" ry="5" stroke-width="5"/>
  <!-- Magnetron center pin -->
  <line x1="100" y1="113" x2="100" y2="153" stroke-width="5"/>
  <!-- Shared vacuum port — bottom center -->
  <line x1="100" y1="172" x2="100" y2="188" stroke-width="8"/>
  <circle cx="100" cy="192" r="8" stroke-width="7"/>
</svg>
