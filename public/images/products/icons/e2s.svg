<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- E2S — wide bore single stage, prominent gas ballast valve on top -->
  <!-- Main body (wide bore = shorter but wider than E2M) -->
  <rect x="28" y="62" width="120" height="76" rx="8" stroke-width="9"/>
  <!-- Wide bore inlet — left, large diameter -->
  <circle cx="28" cy="100" r="28" stroke-width="9"/>
  <circle cx="28" cy="100" r="16" stroke-width="4"/>
  <!-- Large bore rotor -->
  <circle cx="100" cy="100" r="30" stroke-width="6"/>
  <line x1="100" y1="70"  x2="100" y2="130" stroke-width="5"/>
  <line x1="70"  y1="100" x2="130" y2="100" stroke-width="5"/>
  <line x1="79"  y1="79"  x2="121" y2="121" stroke-width="4"/>
  <line x1="121" y1="79"  x2="79"  y2="121" stroke-width="4"/>
  <!-- Gas ballast valve on top — tall distinctive cylinder (E2S signature) -->
  <rect x="122" y="28" width="20" height="34" rx="6" stroke-width="7"/>
  <line x1="132" y1="62" x2="132" y2="62" stroke-width="7"/>
  <line x1="125" y1="42" x2="139" y2="42" stroke-width="4"/>
  <line x1="125" y1="50" x2="139" y2="50" stroke-width="4"/>
  <line x1="132" y1="28" x2="132" y2="20" stroke-width="6"/>
  <circle cx="132" cy="18" r="5" stroke-width="5"/>
  <!-- Ballast valve connects to body -->
  <line x1="132" y1="62" x2="132" y2="62" stroke-width="7"/>
  <!-- Exhaust port right -->
  <rect x="148" y="85" width="16" height="30" rx="3" stroke-width="6"/>
  <!-- Oil sight glass -->
  <rect x="52" y="74" width="11" height="30" rx="2" stroke-width="5"/>
  <!-- Mounting base -->
  <rect x="32" y="150" width="116" height="9" rx="3" stroke-width="6"/>
  <line x1="52"  y1="159" x2="52"  y2="174" stroke-width="5"/>
  <line x1="130" y1="159" x2="130" y2="174" stroke-width="5"/>
  <line x1="35"  y1="174" x2="145" y2="174" stroke-width="5"/>
</svg>
